  /* Layout: app de bolso com barra inferior (Início, Calcular, Problemas); cada guia é uma sequência numerada de passos que abre e fecha. Visual claro único da Bela Visão. */
  :root {
    color-scheme: light;
    --navy: #021c38;
    --navy-2: #0a2a4f;
    --ivory: #f7f4ee;
    --paper: #ffffff;
    --line: #e2ddd2;
    --muted: #5d6b7c;
    --mist: #dfe7f1;
    --alert: #a3261d;
    --alert-bg: #fbecea;
    --ok: #1d6b45;
    --ok-bg: #e8f4ed;
    --note-bg: #eef3f9;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ivory); color: var(--navy); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; }

  .app { min-height: 100%; display: flex; flex-direction: column; }
  header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: var(--ivory);
    display: flex; align-items: center; gap: .7rem; padding-block: .7rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
  header.top img { height: 34px; width: auto; }
  header.top .t { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
  header.top b { font-family: var(--serif); font-weight: 600; font-size: 21px; letter-spacing: .02em; }
  header.top span { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; color: #9fb2c8; }
  header.top .back { margin-left: auto; background: none; border: 1px solid #36506f; color: var(--ivory); border-radius: 999px; padding: .35rem .85rem; font-size: 13px; cursor: pointer; }

  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; box-sizing: border-box;
    padding-block: 1.1rem 6.5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; line-height: 1.08; margin: .2rem 0 .4rem; text-wrap: balance; }
  h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 1.6rem 0 .6rem; }
  .lead { color: var(--muted); margin: 0 0 1rem; }
  .eyebrow { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

  /* Botão principal */
  .cta { display: flex; align-items: center; gap: .9rem; width: 100%; text-align: left; border: 0; cursor: pointer; text-decoration: none;
    background: var(--navy); color: var(--ivory); border-radius: 18px; padding: 1.1rem 1.2rem; box-sizing: border-box; }
  .cta svg { flex: none; width: 34px; height: 34px; }
  .cta b { display: block; font-family: var(--serif); font-size: 23px; font-weight: 600; line-height: 1.1; }
  .cta small { color: #b7c6d8; font-size: 13px; }

  /* Tipos de lente */
  .types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
  .type { display: flex; flex-direction: column; gap: .35rem; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: .95rem .95rem .9rem; text-decoration: none; min-width: 0; }
  .type:active { transform: scale(.98); }
  .type .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--note-bg); display: grid; place-items: center; }
  .type .ic svg { width: 24px; height: 24px; }
  .type b { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.1; }
  .type small { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .level { align-self: flex-start; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: .12rem .5rem; border-radius: 999px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .level.mid { background: #fdf3e2; color: #8a5a07; }
  .level.adv { background: var(--alert-bg); color: var(--alert); }

  .disclaimer { margin-top: 1.4rem; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: .9rem; }

  /* Guias */
  .facts { display: flex; flex-wrap: wrap; gap: .4rem; margin: .2rem 0 1rem; }
  .facts span { font-size: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: .2rem .65rem; }
  details.step { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; margin-bottom: .6rem; overflow: hidden; }
  details.step > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem; font-weight: 600; }
  details.step > summary::-webkit-details-marker { display: none; }
  details.step > summary .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--navy); color: var(--ivory); display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
  details.step > summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
  details.step[open] > summary .chev { transform: rotate(90deg); }
  details.step > summary:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
  .body { padding: 0 1rem 1rem 3.2rem; }
  .body ul { margin: .2rem 0 .6rem; padding-left: 1.05rem; }
  .body li { margin: .28rem 0; }
  .body p { margin: .35rem 0 .6rem; }
  .box { border-radius: 12px; padding: .7rem .85rem; margin: .6rem 0; font-size: 14px; }
  .box.red { background: var(--alert-bg); color: var(--alert); }
  .box.blue { background: var(--note-bg); }
  .box.green { background: var(--ok-bg); color: var(--ok); }
  .box b { display: block; margin-bottom: .15rem; }
  .compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: .5rem; margin: .5rem 0; }
  .compare div { background: var(--ivory); border-radius: 10px; padding: .6rem .7rem; font-size: 13.5px; }
  .compare div b { display: block; font-size: 13px; margin-bottom: .2rem; }
  .golink { display: inline-flex; align-items: center; gap: .35rem; margin-top: .3rem; font-weight: 600; font-size: 14px; color: var(--navy); background: var(--mist); border-radius: 999px; padding: .35rem .8rem; text-decoration: none; }
  .source { font-size: 12px; color: var(--muted); margin-top: 1.2rem; }

  /* Assistente */
  .q { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 1.2rem; }
  .q h1 { font-size: 26px; }
  .opts { display: flex; flex-direction: column; gap: .55rem; margin-top: 1rem; }
  .opt { text-align: left; border: 1.5px solid var(--line); background: var(--ivory); border-radius: 14px; padding: .85rem 1rem; cursor: pointer; }
  .opt:hover, .opt:focus-visible { border-color: var(--navy); outline: none; }
  .opt b { display: block; }
  .opt small { color: var(--muted); }
  .crumbs { font-size: 12.5px; color: var(--muted); margin-bottom: .6rem; }
  .result { border-radius: 18px; padding: 1.2rem; background: var(--navy); color: var(--ivory); }
  .result h1 { color: var(--ivory); }
  .result p { color: #c9d6e6; }
  .result .golink { background: var(--ivory); }
  .restart { margin-top: .9rem; background: none; border: 1px solid var(--line); border-radius: 999px; padding: .5rem 1rem; cursor: pointer; }

  /* Calculadoras */
  .calc-list { display: flex; flex-direction: column; gap: .55rem; }
  .calc-item { display: flex; align-items: center; gap: .8rem; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: .85rem 1rem; text-decoration: none; }
  .calc-item b { display: block; font-size: 15px; }
  .calc-item small { color: var(--muted); font-size: 12.5px; }
  .calc-item .chev { margin-left: auto; color: var(--muted); }
  .form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 1rem; }
  .form .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .field input, .field select { border: 1.5px solid var(--line); border-radius: 10px; padding: .65rem .7rem; background: var(--ivory); font-size: 17px; width: 100%; box-sizing: border-box; font-variant-numeric: tabular-nums; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--navy); }
  .out { margin-top: .9rem; background: var(--navy); color: var(--ivory); border-radius: 16px; padding: 1rem 1.1rem; }
  .out .big { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .out .lbl { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #9fb2c8; }
  .out p { color: #c9d6e6; font-size: 14px; margin: .5rem 0 0; }
  .out .row { display: flex; flex-wrap: wrap; gap: 1rem 1.6rem; }
  .out .warn { background: rgba(255,255,255,.08); border-left: 3px solid #f2c46d; padding: .5rem .7rem; border-radius: 6px; margin-top: .7rem; color: #f5ddb0; }
  .out.empty { background: var(--note-bg); color: var(--muted); }

  /* Problemas */
  .search { width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; padding: .75rem .9rem; background: var(--paper); font-size: 16px; margin-bottom: .8rem; }
  .search:focus { outline: none; border-color: var(--navy); }

  /* Barra inferior */
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--line); display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  nav.tabs a { flex: 1; max-width: 200px; display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .55rem 0 .6rem; text-decoration: none; font-size: 11.5px; color: var(--muted); }
  nav.tabs a svg { width: 23px; height: 23px; }
  nav.tabs a.on { color: var(--navy); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  // ============ Guias por tipo de lente ============
  // Cada guia: passos numerados (a ordem é a da consulta).
  const G = {};
  G.gelatinosa = {
    t: 'Gelatinosa', sub: 'Esférica, tórica e multifocal', lv: ['Iniciante', ''], ic: 'gel',
    facts: ['Diâmetro 14,0–14,5 mm', 'Curva base 8,4–8,8 mm', 'Movimento 0,2–0,5 mm'],
    steps: [
      ['Para quem indicar', `<ul><li>Miopia, hipermetropia e astigmatismo regular.</li><li>Presbiopia (multifocal ou monovisão).</li><li>Uso esportivo ou ocasional: prefira descarte diário.</li></ul>
        <div class="box blue"><b>Córnea irregular?</b>Ceratocone, pós-transplante ou pós-refrativa com astigmatismo irregular enxergam mal com gelatinosa. Vá para <a href="#rigida">Rígida</a> ou <a href="#escleral">Escleral</a>.</div>`],
      ['Antes de adaptar: trate ou adie', `<ul><li>Blefarite ou disfunção de meibômio ativa.</li><li>Olho seco moderado a grave sem tratamento.</li><li>Conjuntivite alérgica ou infecciosa ativa.</li><li>Paciente que não consegue seguir a higiene (pense em descarte diário ou contraindique).</li></ul>`],
      ['Exames da consulta', `<ul><li>Refração atualizada, com a distância ao vértice anotada.</li><li>Ceratometria (K plano e K curvo).</li><li>Biomicroscopia: pálpebras, filme lacrimal (BUT), córnea com fluoresceína.</li><li>Diâmetro corneano visível (HVID) e tamanho da pupila.</li><li>Rotina do paciente: horas de uso, telas, esportes, ambiente.</li></ul>`],
      ['Escolha da primeira lente', `<ul><li><b>Material:</b> silicone-hidrogel (mais oxigênio) como padrão. Descarte diário para uso ocasional ou alérgicos.</li>
        <li><b>Curva base:</b> a maioria tem 1 ou 2 opções. K médio acima de 45 D: escolha a mais curva. Abaixo de 41 D: a mais plana.</li>
        <li><b>Grau:</b> cilindro até 0,75 D → esférica com o equivalente esférico. Cilindro de 1,00 D ou mais → tórica.</li>
        <li><b>Vértice:</b> corrija quando o grau for ±4,00 D ou mais.</li></ul>
        <a class="golink" href="#calc-gel">Calcular o grau da gelatinosa →</a>`],
      ['Avaliar na lâmpada de fenda', `<p>Espere 15 a 20 minutos com a lente no olho.</p>
        <div class="box green"><b>Boa adaptação</b>Cobre toda a córnea, centrada, move 0,2–0,5 mm ao piscar, desliza fácil no teste de empurrar a pálpebra inferior (push-up) e volta. Visão estável, igual ou melhor que os óculos.</div>
        <div class="compare"><div><b>Frouxa</b>Move mais de 1 mm, descentra, borda levanta, visão piora logo depois de piscar. → Curva mais fechada ou outra marca.</div><div><b>Apertada</b>Não move, marca a conjuntiva, vermelhidão perto do limbo, visão melhora logo depois de piscar. → Curva mais plana.</div></div>`],
      ['Tórica: estabilidade e eixo', `<ul><li>Olhe a marca de orientação (geralmente às 6 horas).</li><li>Rotação estável de até 10° é aceitável: compense o eixo pela regra LARS.</li><li>Se a rotação muda a cada piscada, troque de desenho ou de marca.</li></ul>
        <a class="golink" href="#calc-lars">Compensar a rotação (LARS) →</a>`],
      ['Multifocal (presbiopia)', `<ul><li>Descubra o olho dominante (o paciente olha um ponto distante por um buraco feito com as mãos).</li><li>Escolha a adição pelo guia do fabricante (baixa, média ou alta).</li><li>Dê 1 semana de adaptação antes de mexer.</li>
        <li>Longe ruim: −0,25 no olho dominante.</li><li>Perto ruim: +0,25 no olho não dominante.</li><li>Alinhe expectativas: a visão é boa para a rotina, não perfeita em tudo. Monovisão é uma alternativa.</li></ul>`],
      ['Orientações ao paciente', `<ul><li>Lavar e secar as mãos antes de manusear.</li><li>Nunca usar a lente com água: torneira, chuveiro, piscina, mar.</li><li>Não dormir com a lente, a não ser com indicação médica.</li><li>Esfregar e enxaguar a lente com a solução; nunca reaproveitar solução.</li><li>Trocar o estojo todo mês.</li><li>Respeitar o prazo de descarte.</li></ul>
        <div class="box red"><b>Regra de ouro</b>Olho vermelho, dor, luz incomodando ou visão turva: tirar a lente e procurar o médico no mesmo dia.</div>`],

          <div class="warn">Na prova, olhe a marca de orientação. Se girar, use a LARS.</div>`;
      } },
    'calc-lars': { t: 'Compensar rotação da tórica', d: 'Regra LARS', fields: [['a', 'Eixo da receita (°)'], ['r', 'Rotação vista (°)'], ['dir', 'Para onde girou (como você vê)', null, [['L', 'Para a minha esquerda (horário)'], ['R', 'Para a minha direita (anti-horário)']]]],
      run(f) {
        const A = num(f.a), R = num(f.r);
        if (!isFinite(A) || !isFinite(R)) return null;
        const novo = normAxis(f.dir === 'R' ? A - R : A + R);
        return `<div class="lbl">Eixo a pedir</div><div class="big">${novo}°</div><p>LARS: girou para a esquerda, some; para a direita, subtraia. Só compense se a rotação for estável.</p>${R > 20 ? '<div class="warn">Rotação acima de 20°: prefira outro desenho ou marca.</div>' : ''}`;
      } },
    'calc-rgp': { t: 'Primeira lente rígida', d: 'Curva base, grau e diâmetro', fields: [['k1', 'K plano (D)'], ['k2', 'K curvo (D)'], ['s', 'Esférico da refração (D)'], ['c', 'Cilíndrico da refração (D)'], ['v', 'Vértice (mm)', '12']],
      run(f) {
        let k1 = num(f.k1), k2 = num(f.k2), S = num(f.s), C = num(f.c) || 0, d = num(f.v) || 12;
        if (!isFinite(k1) || !isFinite(k2) || !isFinite(S)) return null;
        if (k2 < k1) [k1, k2] = [k2, k1];
        if (C > 0) { S = S + C; C = -C; }
        const dk = k2 - k1;
        const steps = [[0.5, -0.5], [1.0, -0.25], [1.5, 0], [2.0, 0.25], [2.5, 0.5], [3.0, 0.75]];
        let off = null; for (const [lim, o] of steps) if (dk <= lim + 1e-9) { off = o; break; }
        const bcD = k1 + (off ?? 0.75), bcMM = 337.5 / bcD;
        const tear = bcD - k1; // positivo = mais fechada que o K plano
        const power = vertex(S, d) - tear;
        const resid = Math.abs(C) - dk;
        return `<div class="lbl">Primeira lente de prova</div><div class="row"><div><div class="big">${fmtN(bcMM)} mm</div><div class="lbl">curva base (${fmtN(bcD)} D)</div></div><div><div class="big">${fmtD(power)}</div><div class="lbl">grau</div></div><div><div class="big">9,4 mm</div><div class="lbl">diâmetro</div></div></div>
          <p>Astigmatismo corneano ${fmtN(dk)} D → curva ${off === 0 ? 'igual ao K plano' : off < 0 ? `${fmtN(-off)} D mais plana que o K plano` : `${fmtN(off)} D mais fechada que o K plano`}. Lente de lágrima ${tear === 0 ? 'neutra' : fmtD(tear) + ' D'}, compensada no grau.</p>
          ${off === null || dk > 3 ? '<div class="warn">Astigmatismo corneano acima de 3,00 D: considere bitórica ou escleral e fale com o laboratório.</div>' : ''}
          ${Math.abs(C) > 0 && resid > 0.75 ? `<div class="warn">Astigmatismo residual previsto de ${fmtN(resid)} D (refração maior que a córnea). A rígida esférica pode não corrigir tudo.</div>` : ''}
          <div class="warn">É um ponto de partida (nomograma clássico para 9,4–9,6 mm). Confirme com fluoresceína e com o guia do laboratório.</div>`;
      } },
    'calc-sobre': { t: 'Sobre-refração', d: 'Grau final a pedir', fields: [['l', 'Grau da lente de prova (D)'], ['o', 'Sobre-refração esférica (D)'], ['v', 'Vértice (mm)', '12']],
      run(f) {
        const L = num(f.l), O = num(f.o), d = num(f.v) || 12;
        if (!isFinite(L) || !isFinite(O)) return null;
        const Ov = Math.abs(O) >= 4 ? vertex(O, d) : O;
        return `<div class="lbl">Grau a pedir</div><div class="big">${fmtD(L + Ov)}</div><p>${fmtD(L)} da lente + ${fmtD(Ov)} da sobre-refração${Math.abs(O) >= 4 ? ' (corrigida pelo vértice)' : ''}.</p>`;
      } },
    'calc-k': { t: 'Ceratometria: D ↔ mm', d: 'Converter raio e dioptria', fields: [['x', 'Valor (D ou mm)']],
      run(f) {
        const x = num(f.x); if (!isFinite(x) || x <= 0) return null;
        const isMM = x < 20, y = 337.5 / x;
        return `<div class="lbl">${isMM ? 'Em dioptrias' : 'Em milímetros'}</div><div class="big">${isMM ? fmtN(y) + ' D' : fmtN(y) + ' mm'}</div><p>${isMM ? fmtN(x) + ' mm' : fmtN(x) + ' D'} = ${isMM ? fmtN(y) + ' D' : fmtN(y) + ' mm'} (índice 1,3375).</p>`;
      } },
    'calc-vertice': { t: 'Distância ao vértice', d: 'Grau dos óculos para o olho', fields: [['f', 'Grau dos óculos (D)'], ['v', 'Vértice (mm)', '12']],
      run(f) {
        const F = num(f.f), d = num(f.v) || 12; if (!isFinite(F)) return null;
        const r = vertex(F, d);
        return `<div class="lbl">Grau no plano da córnea</div><div class="big">${fmtD(r)}</div><p>Valor exato ${fmtN(r)} D. Abaixo de ±4,00 D a diferença costuma ser desprezível.</p>`;
      } },
    'calc-add': { t: 'Adição para multifocal', d: 'Faixa pela adição dos óculos', fields: [['add', 'Adição dos óculos (D)']],
      run(f) {
        const a = num(f.add); if (!isFinite(a)) return null;
        const band = a <= 1.25 ? 'BAIXA' : a <= 1.75 ? 'MÉDIA' : 'ALTA';
        return `<div class="lbl">Adição da lente</div><div class="big">${band}</div><p>Adição ${fmtD(a)} nos óculos. As faixas mudam entre fabricantes: confirme no guia da marca.</p>
          <div class="warn">Longe ruim: −0,25 no olho dominante. Perto ruim: +0,25 no não dominante. Espere 1 semana antes de ajustar.</div>`;
      } }
  };

  // ============ Telas ============
  function home() {
    const types = ['gelatinosa', 'rigida', 'estetica', 'ortok', 'escleral', 'protese'];
    return `<p class="eyebrow">Guia de prescrição</p>
      <h1>Qual lente para este paciente?</h1>
      <p class="lead">Responda até 3 perguntas e veja a lente indicada, o passo a passo e o cálculo.</p>
      <a class="cta" href="#qual">${IC.help}<span><b>Começar</b><small>Assistente de escolha</small></span></a>
      <h2>Guias por tipo</h2>
      <div class="types">${types.map(k => { const g = G[k]; return `<a class="type" href="#${k}"><span class="ic">${IC[g.ic]}</span><b>${g.t}</b><small>${g.sub}</small><span class="level ${g.lv[1]}">${g.lv[0]}</span></a>`; }).join('')}</div>
      <p class="disclaimer">Guia de apoio para médicos oftalmologistas. Não substitui o exame, o guia do fabricante nem o julgamento clínico. Conteúdo de referência geral da contatologia; as aulas da Solótica e da SOBLEC serão incorporadas e citadas aqui.</p>`;
  }
  function guide(k) {
    const g = G[k];
    return `<p class="eyebrow">Guia · ${g.lv[0]}</p><h1>${g.t}</h1><p class="lead">${g.sub}</p>
      <div class="facts">${g.facts.map(f => `<span>${f}</span>`).join('')}</div>
      ${g.steps.map((s, i) => `<details class="step"${i === 0 ? ' open' : ''}><summary><span class="n">${i + 1}</span>${s[0]}<span class="chev">›</span></summary><div class="body">${s[1]}</div></details>`).join('')}
      <p class="source">Fontes: ${g.src}</p>`;
  }
  function wizard() {
    const cur = wiz[wiz.length - 1];
    if (cur.startsWith('R:')) {
      const r = RES[cur.slice(2)];
      return `<div class="result"><p class="eyebrow" style="color:#9fb2c8">Indicação${r[4] ? ' · ' + r[4] : ''}</p><h1>${r[0]}</h1><p>${r[1]}</p>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">${r[2] ? `<a class="golink" href="#${r[2]}">Abrir o passo a passo →</a>` : ''}${r[3] ? `<a class="golink" href="#${r[3]}">Calcular →</a>` : ''}</div></div>
        <button class="restart" data-act="restart">Recomeçar</button>`;
    }
    const n = QN[cur];
    return `<div class="crumbs">Pergunta ${wiz.length}</div><div class="q"><h1>${n.q}</h1><div class="opts">${n.o.map(o => `<button class="opt" data-go="${o[2]}"><b>${o[0]}</b>${o[1] ? `<small>${o[1]}</small>` : ''}</button>`).join('')}</div></div>
      ${wiz.length > 1 ? '<button class="restart" data-act="wback">← Pergunta anterior</button>' : ''}`;
  }
  function calcList() {
    return `<p class="eyebrow">Ferramentas</p><h1>Calcular</h1><p class="lead">Aceita vírgula ou ponto. Cilindro em notação negativa (se digitar positivo, eu transponho).</p>
      <div class="calc-list">${Object.entries(CALCS).map(([k, c]) => `<a class="calc-item" href="#${k}"><span><b>${c.t}</b><small>${c.d}</small></span><span class="chev">›</span></a>`).join('')}</div>`;
  }
  function calc(k) {
    const c = CALCS[k];
    const fieldHTML = c.fields.map(([id, label, def, opts]) => opts
      ? `<div class="field full"><label for="f-${id}">${label}</label><select id="f-${id}" data-f="${id}">${opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`
      : `<div class="field"><label for="f-${id}">${label}</label><input id="f-${id}" data-f="${id}" inputmode="decimal" autocomplete="off" ${def ? `value="${def}"` : ''}></div>`).join('');
    return `<p class="eyebrow">Calcular</p><h1>${c.t}</h1><p class="lead">${c.d}</p><div class="form">${fieldHTML}</div><div class="out empty" id="out">Preencha os campos para ver o resultado.</div>`;
  }
  function problems() {
    return `<p class="eyebrow">Problemas na adaptação</p><h1>O que está acontecendo?</h1>
      <input class="search" id="psearch" type="search" placeholder="Buscar: dor, embaçado, vermelho…" aria-label="Buscar problema">
      <div id="plist">${PROB.map((p, i) => `<details class="step" data-txt="${(p[1] + ' ' + p[2]).toLowerCase()}"><summary><span class="n" style="${p[0] === 'red' ? 'background:var(--alert)' : ''}">${p[0] === 'red' ? '!' : i}</span><span>${p[1]}<br><small style="font-weight:400;color:var(--muted)">${p[2]}</small></span><span class="chev">›</span></summary><div class="body">${p[3]}</div></details>`).join('')}</div>`;
  }

  // ============ Roteamento ============
  const TAB_OF = k => k === 'problemas' ? 'problemas' : (k === 'calcular' || k.startsWith('calc-')) ? 'calcular' : 'inicio';
  function route() {
    const k = (location.hash || '#inicio').slice(1) || 'inicio';
    let html;
    if (k === 'inicio') html = home();
    else if (k === 'qual') html = wizard();
    else if (G[k]) html = guide(k);
    else if (k === 'calcular') html = calcList();
    else if (CALCS[k]) html = calc(k);
    else if (k === 'problemas') html = problems();
    else html = home();
    main.innerHTML = html;
    document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === TAB_OF(k)));
    document.getElementById('back').hidden = ['inicio', 'calcular', 'problemas'].includes(k);
    window.scrollTo(0, 0);
    if (CALCS[k]) bindCalc(k);
    if (k === 'problemas') bindSearch();
  }
  function bindCalc(k) {
    const c = CALCS[k], out = document.getElementById('out');
    const update = () => {
      const f = {}; main.querySelectorAll('[data-f]').forEach(el => { f[el.dataset.f] = el.value.trim(); });
      let html = null; try { html = c.run(f); } catch (e) { html = null; }
      out.className = 'out' + (html ? '' : ' empty');
      out.innerHTML = html || 'Preencha os campos para ver o resultado.';
    };
    main.querySelectorAll('[data-f]').forEach(el => el.addEventListener('input', update));
    main.querySelectorAll('select[data-f]').forEach(el => el.addEventListener('change', update));
  }
  function bindSearch() {
    const s = document.getElementById('psearch');
    s.addEventListener('input', () => {
      const v = s.value.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      document.querySelectorAll('#plist details').forEach(d => {
        const t = d.dataset.txt.normalize('NFD').replace(/[̀-ͯ]/g, '');
        d.hidden = v && !t.includes(v);
      });
    });
  }
  main.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) { wiz.push(go.dataset.go); route(); return; }
    const act = e.target.closest('[data-act]');
    if (act) { if (act.dataset.act === 'restart') wiz = ['start']; else wiz.pop(); route(); }
  });
  document.getElementById('back').addEventListener('click', () => {
    const k = (location.hash || '').slice(1);
    if (k === 'qual' && wiz.length > 1) { wiz.pop(); route(); return; }
    location.hash = CALCS[k] ? 'calcular' : 'inicio';
  });
  addEventListener('hashchange', route);
  route();
})();
</script>

<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
